<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">
  <!-- Favicon of Polish Levels Map: the map mark (compass and trail) in the level gradient A1 → C2.
       A standalone file outside the app, so the colours are literal: the dark-theme values of
       --lvl-a1 … --lvl-c2 (the tile is dark), the light --ink (tile) and --line-control (south needle). -->
  <defs>
    <linearGradient id="g" x1="4" y1="36" x2="36" y2="4" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0e9a3f"/>
      <stop offset="0.2" stop-color="#1a97f4"/>
      <stop offset="0.4" stop-color="#7d52c3"/>
      <stop offset="0.6" stop-color="#be3d70"/>
      <stop offset="0.8" stop-color="#e06d00"/>
      <stop offset="1" stop-color="#12a7a7"/>
    </linearGradient>
  </defs>
  <rect width="40" height="40" rx="10" fill="#1d2433"/>
  <circle cx="20" cy="20" r="14.5" fill="none" stroke="url(#g)" stroke-width="2.6"/>
  <path d="M11.5 27c3.2-1.2 2.8-5.2 6.4-6s5.2 1.2 7.6-2 2-4.8 2.8-6" fill="none" stroke="#fffdf9" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="0.1 3.4" opacity="0.7"/>
  <g transform="rotate(40 20 20)">
    <path d="M20 9.5 23 20h-6z" fill="url(#g)"/>
    <path d="M20 30.5 17 20h6z" fill="#8c8471"/>
  </g>
  <circle cx="20" cy="20" r="2" fill="#1d2433" stroke="#fffdf9" stroke-width="1"/>
</svg>
