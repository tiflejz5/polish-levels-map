<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Light and dark theme (colours in css/style.css, the switch in js/theme.js) -->
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#faf6ee">
  <meta name="description" content="Learn Polish from A1 to C2, explained in English: topic pages, exercises, flashcards, reviews and the Case Lab. No accounts; progress stays in your browser.">
  <title>Polish Levels Map (A1–C2)</title>
  <!-- Sets the theme and the sidebar state BEFORE the page is drawn.
       plm.theme: "auto" (as in the system), "light" or "dark".
       plm.sidebar: { version: 1, pinned: true|false } (js/sidebar.js). Runs before js/config.js, so the keys are literal. -->
  <script>
    (function () {
      var pref = "auto";
      try { pref = localStorage.getItem("plm.theme") || "auto"; } catch (e) {}
      var dark = pref === "dark" || (pref !== "light" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
      var root = document.documentElement;
      root.setAttribute("data-theme", dark ? "dark" : "light");
      root.setAttribute("data-theme-pref", pref);
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute("content", dark ? "#0e1526" : "#faf6ee");
      // Sidebar pinned? (plm.sidebar, for the whole device) — before drawing,
      // so the content does not jump at start
      var pinned = false;
      try { var sb = JSON.parse(localStorage.getItem("plm.sidebar") || "null"); pinned = !!(sb && sb.version === 1 && sb.pinned === true); } catch (e) {}
      root.setAttribute("data-sidebar", pinned ? "pinned" : "rail");
    })();
  </script>
  <!-- Self-hosted fonts (assets/fonts): preload only the critical files and only over http(s) —
       from file:// a “crossorigin” preload is blocked (console errors), and CSS loads the fonts anyway -->
  <script>
    if (/^https?:$/.test(location.protocol)) {
      ["inter-latin", "inter-latin-ext", "fraunces-latin"].forEach(function (f) {
        var l = document.createElement("link");
        l.rel = "preload"; l.as = "font"; l.type = "font/woff2"; l.crossOrigin = "anonymous";
        l.href = "assets/fonts/" + f + ".woff2";
        document.head.appendChild(l);
      });
    }
  </script>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="assets/favicon-180.png" type="image/png" sizes="180x180">
  <link rel="apple-touch-icon" href="assets/favicon-180.png">
  <link rel="stylesheet" href="css/style.css?v=1">
  <link rel="stylesheet" href="css/print.css?v=1" media="print">
</head>
<body>
  <noscript>
    <p class="noscript">This page needs JavaScript. Turn it on in your browser.</p>
  </noscript>

  <div class="app" id="app">
    <!-- SIDEBAR (js/sidebar.js, DESIGN.md section 3.1):
         a narrow rail (72 px) that expands over the content on hover / focus / tap,
         pinned with the pin; below 768 px a drawer opened with the “Menu” button. -->
    <aside class="sidebar" id="sidebar" aria-label="Navigation">
      <div class="sb-panel" id="sb-panel">
        <div class="sb-head">
          <!-- Logo: a link to the home page (#/) from everywhere -->
          <a class="brand sb-brand" href="#/" aria-label="Polish Levels Map – home page" data-logo></a>
          <button type="button" class="icon-btn sb-toggle" id="sb-toggle" aria-controls="sb-panel" aria-expanded="false" aria-label="Expand sidebar"><span data-icon="panel-left-open"></span></button>
        </div>
        <p class="sb-tagline" id="sidebar-category-name">Your map of Polish, A1–C2</p>

        <div class="sb-scroll">
          <!-- Learning tools (Trail, Today, Review, Practice, the lab, Writing) are drawn by js/render.js -->
          <nav class="sb-nav" id="tools-nav" aria-label="Learning"></nav>

          <!-- Levels A1–C2 (progress in all categories) are drawn by js/render.js -->
          <p class="sb-caption" id="sb-levels-caption">Levels · all categories</p>
          <nav class="sb-nav level-list" id="level-list" aria-labelledby="sb-levels-caption"></nav>

          <!-- The "Exams" group from content/exams/registry.json (js/exam-core.js); hidden while the registry is empty -->
          <nav class="sb-nav exams-nav" id="exams-nav" aria-labelledby="sb-exams-caption" hidden></nav>
          <nav class="sb-nav exams-nav exams-more-nav" id="exams-more-nav" aria-label="Other exams" hidden></nav>
        </div>

        <div class="sb-foot">
          <button type="button" class="sb-item sb-pin" id="sb-pin" aria-pressed="false">
            <span class="sb-icon" aria-hidden="true"><span data-icon="pin"></span></span>
            <span class="sb-label">Pin sidebar</span>
          </button>
        </div>
      </div>
    </aside>

    <!-- RIGHT PART: the content of the current page -->
    <main class="main" id="main" tabindex="-1">
      <!-- Top bar: the menu button (phone only) and the profile menu with the “Data” section (top right corner, js/profiles.js) -->
      <div class="topbar" id="topbar">
        <button type="button" class="btn btn-secondary btn-small menu-btn" id="menu-btn" aria-controls="sidebar" aria-expanded="false"><span data-icon="menu"></span>Menu</button>
        <div class="topbar-actions">
          <!-- Theme: Auto → Light → Dark (js/theme.js) -->
          <button type="button" class="icon-btn theme-btn" id="theme-btn" aria-label="Theme"></button>
          <div class="profile-slot" id="profile-slot"></div>
        </div>
      </div>
      <div class="banners" id="banners"></div>
      <div class="view" id="view"></div>
    </main>
  </div>
  <!-- The backdrop behind the open menu on a phone (a click closes the menu) -->
  <div class="nav-overlay" id="nav-overlay" hidden></div>

  <!-- Scripts loaded in order (no ES modules, so it works from file://).
       ?v=N is the version stamp: npm run build -- --bump raises it everywhere,
       so browsers do not use old copies from their cache. -->
  <!-- LM.APP (app values) and LM.lang (Polish rules): the only language-specific code files -->
  <script defer src="js/config.js?v=1"></script>
  <script defer src="js/lang.js?v=1"></script>
  <script defer src="js/utils.js?v=1"></script>
  <!-- Lucide icons (generated: npm run assets) and shared visual pieces -->
  <script defer src="assets/icons.js?v=1"></script>
  <script defer src="assets/lands.js?v=1"></script>
  <script defer src="assets/empty-states.js?v=1"></script>
  <script defer src="js/ui.js?v=1"></script>
  <script defer src="js/motion.js?v=1"></script>
  <script defer src="js/speech.js?v=1"></script>
  <script defer src="js/charbar.js?v=1"></script>
  <!-- Pure learning logic: reviews, streak, placement test (tests: npm test) -->
  <script defer src="js/learning.js?v=1"></script>
  <script defer src="js/theme.js?v=1"></script>
  <script defer src="js/print.js?v=1"></script>
  <!-- The one list of levels, units, categories and topics (LM.syllabus reads data/syllabus.js) -->
  <script defer src="js/syllabus.js?v=1"></script>
  <script defer src="js/store.js?v=1"></script>
  <script defer src="js/dialogs.js?v=1"></script>
  <script defer src="js/render.js?v=1"></script>
  <script defer src="js/profiles.js?v=1"></script>
  <script defer src="js/markdown.js?v=1"></script>
  <!-- Highlighted sections (callouts) and tables in content -->
  <script defer src="js/callouts.js?v=1"></script>
  <script defer src="js/toc.js?v=1"></script>
  <script defer src="js/shortcuts.js?v=1"></script>
  <script defer src="js/handbook.js?v=1"></script>
  <!-- Generated data loaded at start (npm run build): syllabus and level status, topic pages -->
  <script defer src="data/syllabus.js?v=1"></script>
  <script defer src="data/pages.js?v=1"></script>
  <!-- Shared writing trainer engine and its timer (exam configs come from the exam data) -->
  <script defer src="js/timer.js?v=1"></script>
  <script defer src="js/writing-trainer.js?v=1"></script>
  <!-- Exams from the registry (empty until stage E): registry at start, logic and module; exam data on demand -->
  <script defer src="data/exams-registry.js?v=1"></script>
  <script defer src="js/exam-logic.js?v=1"></script>
  <script defer src="js/exam-core.js?v=1"></script>
  <script defer src="js/exam-ui.js?v=1"></script>
  <!-- Learning data per profile and the mistake log -->
  <!-- Pure logic of the attempt log and stats (before profile-data.js, which uses it) -->
  <script defer src="js/learning-stats.js?v=1"></script>
  <script defer src="js/profile-data.js?v=1"></script>
  <!-- Flashcards: schedule and pure logic (tests: npm test), saved in plm.cards.<profile> -->
  <script defer src="js/cards-schedule.js?v=1"></script>
  <script defer src="js/cards-logic.js?v=1"></script>
  <script defer src="js/cards-store.js?v=1"></script>
  <script defer src="js/trail-logic.js?v=1"></script>
  <script defer src="js/trail-store.js?v=1"></script>
  <script defer src="data/trail.js?v=1"></script>
  <!-- Deck index (small; the decks themselves load on demand from data/decks/) and the Decks tab -->
  <script defer src="data/decks-index.js?v=1"></script>
  <script defer src="js/cards.js?v=1"></script>
  <script defer src="js/cards-browse.js?v=1"></script>
  <script defer src="js/words.js?v=1"></script>
  <!-- Flashcards and mistakes: one queue (review-queue.js, pure logic) and the #/review view (review.js) -->
  <script defer src="js/review-queue.js?v=1"></script>
  <script defer src="js/mistake-task.js?v=1"></script>
  <script defer src="js/review.js?v=1"></script>
  <!-- Writing: model answers with comments (writing trainer data loaded on demand) -->
  <script defer src="js/writing.js?v=1"></script>
  <script defer src="js/trail.js?v=1"></script>
  <script defer src="js/mistakes.js?v=1"></script>
  <!-- Exercise engine (logic without DOM + view); exercise data loaded on demand from data/sets/ -->
  <script defer src="js/exercise-logic.js?v=1"></script>
  <script defer src="js/final-logic.js?v=1"></script>
  <script defer src="js/exercise-engine.js?v=1"></script>
  <script defer src="js/practice-hub.js?v=1"></script>
  <script defer src="js/final.js?v=1"></script>
  <!-- The Case Lab: shared lab parts, then the Case Lab views (data/lab.js loaded on demand) -->
  <script defer src="js/lab.js?v=1"></script>
  <script defer src="js/lab-cases.js?v=1"></script>
  <!-- Stats (attempt log, js/learning-stats.js) -->
  <script defer src="js/stats-page.js?v=1"></script>
  <!-- Search (the index data/search-index.js loads on the first opening) -->
  <script defer src="js/search-logic.js?v=1"></script>
  <script defer src="js/search.js?v=1"></script>
  <!-- Own notes (a panel on content pages, #/notes) -->
  <script defer src="js/notes.js?v=1"></script>
  <script defer src="js/today.js?v=1"></script>
  <!-- Placement test (questions generated by npm run build) -->
  <script defer src="js/placement.js?v=1"></script>
  <script defer src="js/data-menu.js?v=1"></script>
  <script defer src="js/sidebar.js?v=1"></script>
  <!-- Milestone celebrations (GSAP on demand) -->
  <script defer src="js/celebrate.js?v=1"></script>
  <script defer src="js/app.js?v=1"></script>
</body>
</html>
